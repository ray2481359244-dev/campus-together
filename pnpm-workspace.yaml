packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  '@prisma/client': true
  prisma: true
  argon2: true
  esbuild: true
  embedded-postgres: true
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/darwin-arm64': true
minimumReleaseAgeExclude:
  - '@playwright/test@1.64.1'
  - dotenv@18.0.8
  - lucide-react@1.57.0
  - playwright-core@1.64.1
  - playwright@1.64.1
  - react-dom@19.3.1
  - react@19.3.1
