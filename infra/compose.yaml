services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
      POSTGRES_DB: campus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - campus_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  campus_pg:
